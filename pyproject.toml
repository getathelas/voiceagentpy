[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceagentpy"
version = "0.1.0"
description = "OpenAI-style Python client for realtime voice agents (OpenAI Realtime, xAI Grok Voice)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ash Bhat", email = "me@ashbhat.com" }]
keywords = ["voice", "realtime", "openai", "grok", "agent", "webrtc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
flask = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "flask-cors>=4.0",
]
examples = [
    "voiceagentpy[flask]",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/theashbhat/voiceagentpy"
Repository = "https://github.com/theashbhat/voiceagentpy"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceagentpy"]

[tool.hatch.build.targets.sdist]
include = ["src/voiceagentpy", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
